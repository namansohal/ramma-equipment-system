# Keeps the free Supabase database from pausing (it pauses after 7 days with no
# activity) and keeps the free Render server awake-ish. Calls /health once a
# day; that endpoint reads a table. If the call fails, the run turns red and
# GitHub emails you, which is also an early warning that the site is down.
name: Keep database awake

on:
  schedule:
    - cron: "37 5 * * *"   # 05:37 UTC every day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /health (retries while Render wakes up)
        run: |
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 20 --retry-all-errors --max-time 90 \
            https://ramma-equipment-system.onrender.com/health
